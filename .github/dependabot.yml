# 依存パッケージと GitHub Actions の更新（#73-6）
# - 月 1 回、エコシステムごとに 1 本の PR にまとめる（Vercel のデプロイ数を増やさないため。チーム運用のルール）
# - develop に向けて作る（main へは通常のリリースで入る）
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
