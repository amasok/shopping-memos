# 依存パッケージと GitHub Actions の更新（#73-6）
# - 月 1 回、マイナー・パッチの更新はエコシステムごとに 1 本の PR にまとめる（Vercel のデプロイ数を増やさないため）
# - メジャーの更新は、壊れたときに切り分けて戻せるよう、パッケージごとに個別の PR にする（数は少ない）
# - develop に向けて作る（main へは通常のリリースで入る）
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
