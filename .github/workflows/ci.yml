name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# 同じブランチ/PRの古い実行を止める。
# main は本番DBマイグレーションを含み、paths-filter は push 単位の差分しか見ないため、
# 実行が待機・取り消しされるとマイグレーションが適用されなくなる。main は commit ごとに別 group にする
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # next build はテストファイルの型エラーを検出しない（Next.js のバージョンで挙動が変わる）ため、
      # tsconfig の全ファイルを明示的に型チェックする
      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:run

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # ビルド時にDB接続は不要（スキーマのみ使用）
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

  migrate:
    name: Migrate Production DB
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for migration changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            migrations:
              - 'src/infrastructure/db/drizzle/migrations/**'

      - name: Setup Node.js
        if: steps.changes.outputs.migrations == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.changes.outputs.migrations == 'true'
        run: npm ci

      - name: Run migrations
        if: steps.changes.outputs.migrations == 'true'
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  # E2Eテストは PR と main への push で実行
  # ログイン済みテスト（e2e/auth）は実DBが必要なため Postgres サービスを起動する
  e2e:
    name: E2E Tests
    # ubuntu-latest(26.04) は Playwright 1.58 が未対応のため、対応OSに固定する
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopping_memos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shopping_memos_e2e"
      # E2E専用のダミー値（本番では使用しない）
      AUTH_SECRET: "e2e-ci-only-secret-not-for-production"
      # next start（NODE_ENV=production）では Auth.js が localhost を信頼しないため明示する
      AUTH_TRUST_HOST: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (E2E DB)
        run: npm run db:migrate

      # playwright.config.ts の webServer は CI では next start で起動するため、事前にビルドする
      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # SW・オフライン（e2e/offline）。SW を有効にするため本番ビルド（next start, port 3100）で実行する
      - name: Run offline E2E tests
        run: E2E_OFFLINE=true npx playwright test --project=offline

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
