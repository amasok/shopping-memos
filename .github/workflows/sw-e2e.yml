name: SW Lifecycle E2E

# SW の更新・kill switch の E2E（ビルドを 4 回切り替えるため 5〜7 分かかる）。
# PR のたびには実行せず、SW 関連のファイルが変わったときと手動実行のときだけ動かす。
# package.json・package-lock.json は依存の更新のたびに動いてしまうため対象にしない（Serwist などを更新したら手動で実行する）
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/app/sw*.ts"
      - "src/lib/sw/**"
      - "src/components/pwa/**"
      - "src/app/serwist/**"
      - "next.config.ts"
      - "playwright.config.ts"
      - "src/hooks/useServiceWorkerUpdate.ts"
      - "src/app/api/version/**"
      - "src/app/layout.tsx"
      - "scripts/e2e-sw-lifecycle.sh"
      - "e2e/offline/**"
      - ".github/workflows/sw-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sw-lifecycle:
    name: SW Lifecycle E2E
    # ubuntu-latest(26.04) は Playwright 1.58 が未対応のため、対応OSに固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # ビルド時にDB接続は不要（スキーマのみ使用）
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      # Better Auth（#61 A3a）。next start（NODE_ENV=production）は起動時に認証とメールの環境変数を確かめるので、E2E専用のダミー値を渡す。
      # BETTER_AUTH_URL は playwright.config.ts が webServer ごとに渡す。この E2E はログインせず、メールも送らない
      BETTER_AUTH_SECRET: "e2e-ci-only-better-auth-secret-not-for-production"
      OTP_EVENT_HMAC_KEY: "e2e-ci-only-otp-event-hmac-key-not-for-production"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      RESEND_API_KEY: "re_e2e_ci_dummy_not_used"
      EMAIL_FROM: "noreply@example.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run SW lifecycle E2E
        run: npm run test:e2e:sw-lifecycle

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-sw-lifecycle
          path: playwright-report/
          retention-days: 7
