services:
  postgres:
    image: postgres:16-alpine
    container_name: shopping-memos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping_memos
    # 共有ネットワークから接続されないよう、localhost だけで待ち受ける（#73-7）
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # シンプルなDB管理ツール
  # http://localhost:8080 でアクセス
  # System: PostgreSQL, Server: postgres, User: postgres, Password: postgres, Database: shopping_memos
  adminer:
    image: adminer:latest
    container_name: shopping-memos-adminer
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
